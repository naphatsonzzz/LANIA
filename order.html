<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อ | LANIA</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .form-wrap {
      max-width: 36rem;
      margin: 0 auto;
    }
    .field .optional {
      color: var(--beige-deep);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">LANIA</a>
      <ul class="nav">
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="product.html">สินค้า</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="form-wrap">
          <div class="section__head">
            <h1>สั่งซื้อ</h1>
            <span class="rule"></span>
            <p class="lead">กรอกข้อมูลด้านล่างเพื่อยืนยันการสั่งซื้อ</p>
          </div>

          <form id="orderForm">
            <div class="field">
              <label for="customerName">ชื่อลูกค้า</label>
              <input type="text" id="customerName" name="customerName" autocomplete="name" required>
            </div>

            <div class="field">
              <label for="contact">เบอร์โทร / Line</label>
              <input type="text" id="contact" name="contact" required>
            </div>

            <div class="field">
              <label for="items">รายการสินค้า</label>
              <input type="text" id="items" name="items" required>
            </div>

            <div class="field">
              <label for="total">จำนวนเงินรวม (บาท)</label>
              <input type="number" id="total" name="total" min="0" step="any" inputmode="decimal" required>
            </div>

            <div class="field">
              <label for="note">หมายเหตุ <span class="optional">(ไม่บังคับ)</span></label>
              <textarea id="note" name="note"></textarea>
            </div>

            <button type="submit" class="btn btn--solid btn--block">ยืนยันสั่งซื้อ</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container text-center">
      <p>© 2026 LANIA</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
